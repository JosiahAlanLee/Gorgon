name: HydraPy main compatibility
# Weekly, and on demand: validate the Rack module against HydraPy's current main.
# When everything passes and the fixture is unchanged, open a pull request that
# moves hydrapy.pin forward. If the fixture differs, the run fails: that is a
# signal-semantics change and goes through spec/ first.
#
# The pull request step needs "Allow GitHub Actions to create and approve pull
# requests" enabled under Settings → Actions → General.
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      pinned: ${{ steps.main.outputs.pinned }}
    steps:
      - uses: actions/checkout@v4
      - id: main
        run: |
          sha=$(git ls-remote https://github.com/JosiahAlanLee/hydrapy refs/heads/main | cut -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "pinned=$(tr -d '[:space:]' < hydrapy.pin)" >> "$GITHUB_OUTPUT"
  validate:
    needs: resolve
    if: needs.resolve.outputs.sha != needs.resolve.outputs.pinned
    uses: ./.github/workflows/rack.yml
    with:
      hydrapy_ref: ${{ needs.resolve.outputs.sha }}
  bump:
    needs: [resolve, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ needs.resolve.outputs.sha }}" > hydrapy.pin
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: ci/hydrapy-pin
          title: "Move hydrapy.pin to ${{ needs.resolve.outputs.sha }}"
          commit-message: "Move hydrapy.pin to HydraPy main ${{ needs.resolve.outputs.sha }}"
          body: |
            HydraPy `main` is at `${{ needs.resolve.outputs.sha }}`; the pin was `${{ needs.resolve.outputs.pinned }}`.
            The Rack module's full Linux validation passed against it and the fixture is unchanged, so this is a compatible move.

            Compare: https://github.com/JosiahAlanLee/hydrapy/compare/${{ needs.resolve.outputs.pinned }}...${{ needs.resolve.outputs.sha }}

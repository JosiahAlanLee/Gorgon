<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101414"/><g font-family="sans-serif"><text x="110" y="130" font-size="58" fill="#e7bd64">One-command Linux sessions</text><text x="110" y="260" fill="#ddd" font-size="34">pip install -e .                 # from Gorgon</text><text x="110" y="345" fill="#ddd" font-size="34">pip install -e &quot;../hydrapy[live,jack]&quot;</text><text x="110" y="430" fill="#ddd" font-size="34">gorgon init --workspace &quot;$PWD/../hydrapy&quot;</text><text x="110" y="515" fill="#ddd" font-size="34">gorgon doctor</text><text x="110" y="600" fill="#ddd" font-size="34">gorgon start</text><text x="110" y="685" fill="#ddd" font-size="34">gorgon stop</text></g></svg>

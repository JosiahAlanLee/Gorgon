<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101414"/><g font-family="sans-serif"><text x="110" y="130" font-size="58" fill="#e7bd64">Ping: measure a destination</text><text x="110" y="260" fill="#ddd" font-size="34">PULSE → destination trigger · audio → RETURN</text><text x="110" y="345" fill="#ddd" font-size="34">PING or AUTO · THRESH defaults to 10 mV</text><text x="110" y="430" fill="#ddd" font-size="34">48 kHz: Machinemodule 24.19 ms · Monomodule 24.31 ms</text><text x="110" y="515" fill="#ddd" font-size="34">Median: 64 pings; Monomodule: 23 pings</text><text x="110" y="600" fill="#ddd" font-size="34">Align voices first, then OFFSET against the picture</text></g></svg>

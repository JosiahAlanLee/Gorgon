<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="#101414"/><g font-family="sans-serif"><text x="110" y="130" font-size="58" fill="#e7bd64">BUS OUT and BUS IN</text><text x="110" y="260" fill="#ddd" font-size="34">BUS OUT: bits 0–5 = hits · bit 6 = FILL · bit 7 = 0</text><text x="110" y="345" fill="#ddd" font-size="34">BUS IN: bits 0–5 = mutes · bit 6 = FILL</text><text x="110" y="430" fill="#ddd" font-size="34">Channels 1–8 = bits · channel 9 = optional clock</text><text x="110" y="515" fill="#ddd" font-size="34">V3 only: bus mutes add to editor mutes</text></g></svg>

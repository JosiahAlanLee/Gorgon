[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtut"
version = "0.1.0"
description = "Film the Gorgon / HydraPy / Rack modules tutorial on one machine"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
dependencies = [
  "pyyaml>=6",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "pillow>=10",
  "JACK-Client>=0.5.5",
  "playwright>=1.45",
  "zstandard>=0.21",
]

[project.optional-dependencies]
narration = ["kokoro>=0.9", "soundfile>=0.12", "faster-whisper>=1.0"]
test = ["pytest"]

[project.scripts]
gtut = "gtut.cli:main"

[tool.setuptools]
packages = ["gtut"]

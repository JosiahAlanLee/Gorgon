    narration: >
      Everything here ran inside one computer. Gorgon can also send clock, gates, pitch and automation
      straight to a modular, through a DC-coupled interface such as an Expert Sleepers ES-3, or an ES-40
      with gate and CV expanders. Those paths are in the documentation, and they are not yet validated
      on real hardware end to end, so they are not demonstrated here.

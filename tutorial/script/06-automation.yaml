chapter: 6
slug: automation
title: Automating the picture
defaults:
  needs: [controller]
  setup:
    studio: {patch: patches/gorgon_corridor.py, score: scores/demo.json, transport: stop}
    actions:
      - studio.click: '#visualPageTab'     # automation lives on the Visual page
shots:
  - id: key
    title: A value at a row
    source: [hydrapy/docs/gorgon-editor-walkthrough.md#4-shape-visual-automation, hydrapy/docs/gorgon-tracker.md]
    narration: >
      On the Visual page, the lanes hold keys: a value at a row. Select a Dolly Z cell; {cell}
      the editor under the grid shows its value. Type a new one, {value} and write the key. Playback doesn't move.
      Seek to that row and play, {play} and the picture takes the value.
    actions:
      - at: cell
        studio.click: {selector: '#trackerRows [aria-label^="Dolly Z, row 08"]'}
      - at: value
        studio.fill: {target: '#cellValue', text: '0.65'}
      - studio.click: '#writeKeyBtn'
      - at: play
        studio.click: '#seekCellBtn'
      - after: 0.4
        studio.press: Space
      - after: 4
        studio.press: Space
    frames:
      - {window: studio, rect: [0.1, 0.22, 0.9, 0.6]}
    verify:
      - "visual cells' aria-label starts with the track name ('Dolly Z, row 08, ...')"
      - "Write key does not seek (walkthrough §4.1)"
  - id: curve
    title: Hold, Linear, Smooth
    narration: >
      The curve below the grid is the same lane. Click it to set a key: across picks the row, and height picks the value. {curve}
      The edit cursor moves there; playback doesn't.
      Hold keeps each value until the next key; {hold} Linear draws straight lines between keys; {linear}
      Smooth eases in and out. {smooth} The choice applies to the whole lane in this pattern.
    actions:
      - studio.click: {selector: '#trackerRows [aria-label^="Dolly Z, row 18"]'}
      - at: curve
        studio.click: '#curveCanvas'
      - at: hold
        studio.click: {role: button, name: Hold}
      - at: linear
        studio.click: {role: button, name: Linear}
      - at: smooth
        studio.click: {role: button, name: Smooth}
    frames:
      - {window: studio, rect: [0.03, 0.6, 0.72, 0.4]}
    verify:
      - "a curve click sets a key at the clicked row (x) and value (y), moves the edit cursor there, and does not seek (app.js:658-662)"
      - "ease buttons named Hold / Linear / Smooth inside #easeButtons"
  - id: bindings
    title: Bindings
    narration: >
      Patch bindings decide which control each lane drives. {bind}
      The patch declares its controls by name, and this one maps Dolly Z to two-dimensional scale,
      Roll to rotation, and Feedback to the image memory. It is not a 3D camera.
      Lane values keep their own units: zero to one, degrees, and zero to point nine.
    actions:
      - at: bind
        studio.point: '#bind_z'
      - after: 1.2
        studio.point: '#bind_roll'
      - after: 1.2
        studio.point: '#bind_feedback'
    frames:
      - {window: studio, rect: [0.78, 0.46, 0.22, 0.34], zoom: 1.0}
    verify:
      - "Dolly Z is 2D scale, not depth reprojection (gorgon_corridor docstring, tracker guide)"
      - "lane units 0–1, degrees, 0–0.9; no normalisation to the control's range"
  - id: patterns
    title: Name and copy patterns
    source: [hydrapy/docs/gorgon-editor-walkthrough.md#5-name-and-copy-patterns]
    narration: >
      Pattern tools renames, copies and clears. Name this one First Phrase, {name}
      and the name appears on its card. Then copy it to pattern two, {copy} which replaces everything there, name and curves included.
      The order of patterns and their length are fixed for now; there is no song chain yet.
    actions:
      - studio.click: {selector: '#patternMenu summary'}
      - at: name
        studio.fill: {target: '#patternName', text: FIRST PHRASE, press: Enter}
      - at: copy
        studio.select: {target: '#duplicateTarget', value: '1'}
      - studio.click: '#duplicatePatternBtn'
    frames:
      - {window: studio, rect: [0, 0, 0.75, 0.5]}
    verify:
      - "#patternMenu is a <details>; #duplicateTarget option values (0-based index?) — check"
      - "copy replaces destination incl. name and interpolation (§5.2)"
      - "no variable song chain (§5.4)"
